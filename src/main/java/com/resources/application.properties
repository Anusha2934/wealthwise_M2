# ─────────────────────────────────────────────
# WealthWise — Application Configuration
# ─────────────────────────────────────────────

# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/wealthwise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload limits (CAS PDFs can be large)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# NAVAll.txt seed file path
app.navall.file.path=src/main/resources/data/NAVAll.txt

# Logging
logging.level.com.wealthwise=INFO
logging.level.org.springframework.web=WARN
